<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>

    <header>

                <a class="logo" alt="logo radio alento"></a>

            </div>

            <ul class="header-menu">
                <button id="login">Login</button>

        </div>
    </header>

    <div class="content-wrapper">

        <section class="about-section">
                <div class="call-to-action-wrapper">
                    <h1>Sobre o acervo</h1>
                    <p>Aqui você encontra esboços de diversas obras, bem como os livros a estes relacionados. Conhecimento enriquecedor ao alcance de todos, em uma plataforma amigável, completa e intuitiva.</p>
                    <button class="call-to-action-btn">Explorar coleção</button>
                </div>

                <div alt="" class="call-to-action-image">
        </section>

        <section class="mission-section">

        </section>

    </div>

    <script src="/src/js/index.js"></script>
